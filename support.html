<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoraOS Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Tahoma, sans-serif;
    }

    body {
        background: #ffffff;
        color: #000000;
        padding: 60px 20px;
        text-align: center;
    }

    nav {
        width: 100%;
        max-width: 900px;
        margin: 0 auto 60px auto;
        display: flex;
        justify-content: center;
        gap: 40px;
        font-size: 15px;
    }

    nav a {
        text-decoration: none;
        color: #000;
        padding-bottom: 4px;
        border-bottom: 2px solid transparent;
        transition: 0.2s;
    }

    nav a:hover {
        border-bottom: 2px solid #3A7AFE;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    .form-box {
        max-width: 650px;
        margin: 0 auto;
        text-align: left;
        background: #f7f7f7;
        padding: 30px 35px;
        border-radius: 12px;
        border: 1px solid #e0e0e0;
        line-height: 1.6;
        font-size: 17px;
    }

    label {
        display: block;
        margin-top: 18px;
        font-weight: bold;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    input[type="file"] {
        padding: 6px;
    }

    button {
        margin-top: 25px;
        padding: 14px 20px;
        background: #3A7AFE;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.25s;
    }

    button:hover {
        background: #2f63d6;
        transform: translateY(-2px);
    }

    footer {
        margin-top: 70px;
        font-size: 13px;
        color: #777;
    }

    footer:hover::after {
        content: " • Support System Ready";
        color: #3A7AFE;
    }
</style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="support.html">Support</a>
</nav>

<h1>NoraOS Support</h1>

<div class="form-box">
    <form id="support-form">

        <label>Your Name</label>
        <input type="text" name="user_name" required>

        <label>Your Email</label>
        <input type="email" name="user_email" required>

        <label>Issue Description</label>
        <textarea name="message" rows="5" required></textarea>

        <label>Attach Image (optional)</label>
        <input type="file" name="attachment" accept="image/*">

        <button type="submit">Submit Support Request</button>
    </form>
</div>

<footer>
    © <span id="year"></span> NoraOS — Designed for everyone.
</footer>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="text/javascript">
    (function() {
        // Replace with your Public Key
        emailjs.init({
          publicKey: "YOUR_PUBLIC_KEY",
        });
    })();
</script>
<script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById('support-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        // These IDs from the EmailJS Dashboard
        const serviceID = 'default_service';
        const templateID = 'template_id';

        emailjs.sendForm(serviceID, templateID, this)
            .then(() => {
                alert('Sent!');
            }, (err) => {
                alert(JSON.stringify(err));
            });
    });
</script>

</body>
</html>
